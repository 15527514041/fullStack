<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 移动端禁止双指缩放/双击缩放(配合 touch-action,见 theme.css) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="icon" type="image/svg+xml" href="/confluo-logo.svg" />
    <title>Confluo 汇流</title>
    <script>
      // 在首屏样式生效前应用主题，避免深色模式刷新时闪白。
      (() => {
        try {
          const savedTheme = localStorage.getItem('vueuse-color-scheme')
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const mode = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : (prefersDark ? 'dark' : 'light')
          document.documentElement.classList.toggle('dark', mode === 'dark')
          document.documentElement.dataset.theme = mode
          const savedColorTheme = localStorage.getItem('confluo-color-theme')
          document.documentElement.dataset.colorTheme =
            savedColorTheme === 'blue' || savedColorTheme === 'gold' ? savedColorTheme : 'green'
        } catch {
          // localStorage 不可用时由前端主题模块回退到系统偏好。
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
